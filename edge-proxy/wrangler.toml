name = "douyin-mindscopelab-edge"
main = "index.js"
compatibility_date = "2024-11-01"

# Cloudflare Pages 自定义域名需要一条 CNAME 记录，
# 而通过 OAuth 登录的 wrangler 令牌没有 DNS 写权限。
# 这里用 Workers 自定义域名作为等效方案：Cloudflare 会自动创建并托管 DNS 记录与证书，
# Worker 只做透明转发，落到 Pages 生产域名上。
routes = [
  { pattern = "douyin.mindscopelab.org", custom_domain = true }
]
