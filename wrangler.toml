name = "douyin-downloader"
compatibility_date = "2026-01-01"
pages_build_output_dir = "./dist"

# 页面函数运行在边缘，Node.js 兼容关闭即可（代码全用 Web API）
compatibility_flags = []

[vars]
# 解析核心：自建匿名 H5 解析（完全免费，无需 API Key）
PARSER_PROVIDER = "self-hosted-h5"

# 未配置 TURNSTILE_SECRET_KEY 时是否放行解析请求。
# 当前为 true：免费方案开箱即用，无需申请 Turnstile。
# 公网若担心被刷，请在 Cloudflare Dashboard 建 Turnstile widget，
# 配好 TURNSTILE_SECRET_KEY / TURNSTILE_SITE_KEY 后改回 false。
ALLOW_UNVERIFIED = "true"
